<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>maccn card preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      font-family: system-ui;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #242424; }
    }
    body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #737373; pointer-events: none; font-size: 12px; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <script type="module" src="/examples/card.js"></script>
</body>
</html>
